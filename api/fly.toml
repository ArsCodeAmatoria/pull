# Fly.io app for the Ridgetechone CCA Go API.
# Deploy from this directory: cd api && fly deploy

app = "ridgetechone-cca"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  CCA_API_ADDR = ":8080"
  CCA_DATA_DIR = "/data"
  TEMPORAL_NAMESPACE = "pull-cca"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "cca_data"
  destination = "/data"
  initial_size = "1gb"
